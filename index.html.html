var S=[
["🌐","1. ICT kya hai",["ICT ka matlab hai Information aur Communication Technology.","Wo sab tools jinse hum information collect, store, process aur share karte hain: phone, laptop, internet.","Paanch components hain: Hardware, Software, Data, Network aur People.","Data kacchi facts hain. Information processed data hai jiska matlab banta hai."],"ICT stands for Information and Communication Technology. It refers to technologies used to collect, store, process, retrieve and communicate information. Its components are hardware, software, data, networks and people."],
["🤖","2. Emerging Trends",["AI wo machine hai jo insaan ki tarah seekhti aur sochti hai, jaise ChatGPT.","Cloud computing mein files internet ke server pe rakhte hain, jaise Google Drive. IoT mein roz marra ki cheezein internet se jud kar data bhejti hain, jaise smart watch.","VR poori nakli duniya hai. AR asli duniya pe digital cheezein lagata hai, jaise Snapchat filter.","Blockchain ek shared digital register hai jisme data badalna mushkil hai. Big Data bohot bada data hai jisse patterns nikalte hain."],"Emerging trends include AI, cloud computing, IoT, VR, AR, blockchain and big data. Benefits: speed and automation. Challenges: privacy risks, cybercrime and cost."],
["🔗","3. Networks aur Types",["Network do ya zyada devices ka aapas mein judna hai taake data aur resources share ho sakein, jaise ek printer sab ke liye.","PAN sirf tumhare aas paas hota hai, jaise phone aur Bluetooth. LAN ek building hai, jaise university ka WiFi.","MAN poora shehr hai. WAN poori duniya hai, jaise internet. Yaad rakho: Personal, Local, Metropolitan, Wide."],"A computer network is a group of connected devices that share data and resources. Types: PAN, LAN, MAN and WAN, each with its coverage area and an example."],
["⭐","4. Topologies",["Bus mein ek lambi cable se sab jude hote hain. Sasti hai, magar cable kharab ho to poora network band.","Star mein sab ek central switch se jude hote hain. Ek PC kharab ho to sirf wahi affect hota hai, magar switch kharab ho to sab band.","Ring mein data gol ghoomta hai. Ek device ya cable toote to poora ring disturb ho jata hai.","Mesh mein har device har doosre se juda hota hai. Sabse reliable hai magar bohot mehnga. Tree stars ka hierarchy hai aur Hybrid do topologies ka mix."],"A topology is the layout of devices in a network. For each topology write: definition, two or three advantages, two or three disadvantages, and draw a diagram."],
["🛡️","5. Internet, Intranet, Extranet",["Internet sab ke liye public hai, jaise Google. Intranet sirf organisation ke andar private hota hai. Extranet mein organisation ke saath selected bahar ke log hote hain, jaise supplier portal.","Networking ke faide: fori rabta, remote work, resource sharing. Nuqsanat: hacking, malware, identity theft, privacy loss.","Hifazat: mazboot password, multi factor authentication, software update, aur shak wale links se bachna."],"The internet is global and public, an intranet is private to an organisation, and an extranet gives selected outsiders controlled access. Networking improves communication but brings security risks."],
["💻","6. Programming",["Programming computer ko step by step instructions dena hai, jaise chai ki recipe.","Seekhne ki chhe wajuhat: problem solving, career, automation, creativity, technology samajhna, aur freelancing ya business.","Domains: web, mobile apps, games, data science aur AI, embedded systems, cybersecurity."],"Programming is the process of writing instructions that tell a computer how to perform a task, using a programming language such as Python, Java or C++."],
["🐍","7. Languages",["Python AI aur data ke liye, Java enterprise apps ke liye, JavaScript websites ke liye.","C aur C plus plus systems aur games ke liye, C sharp desktop apps aur Unity ke liye.","High level languages insaan ko samajh aati hain. Low level machine ke qareeb hoti hain: machine language aur assembly.","Compiler poora code ek saath translate karta hai. Interpreter line by line chalata hai."],"High-level languages are easy for humans; low-level languages are close to the machine. A compiler translates the whole program before execution, an interpreter runs it line by line."],
["🧩","8. Problem Solving",["Saat steps: Understand, Analyse, Plan, Represent, Implement, Test aur Maintain.","Algorithm tarteeb wale finite steps hain. Pseudocode asaan English jaisa code hai. Flowchart symbols se bana diagram hai.","Teen constructs: Sequence yaani ek ke baad ek, Selection yaani IF ELSE faisla, Iteration yaani loop.","Errors: Syntax mein language ke rules toote hain. Logic mein program chalta hai magar jawab galat. Runtime mein chalte chalte crash."],"Problem solving: understand, analyse, plan, represent, implement, test, maintain. The three constructs are sequence, selection and iteration."],
["🖥️","9. Computer Hardware",["Hardware computer ke wo hisse hain jinhe tum chhoo sakte ho. Computer ek intelligent device hai: input leta hai, process karta hai, store karta hai aur output deta hai.","Input: keyboard, mouse. Processing: CPU, jisme ALU, Control Unit aur registers hote hain.","Memory: RAM temporary, ROM permanent, Cache bohot tez. Storage: HDD, SSD. Output: monitor, printer.","Communication hardware: NIC, modem, router. Isi liye ise communication device kehte hain."],"Computer hardware refers to the physical components of a computer. It accepts input, processes data, stores results and produces output, and communication hardware lets it exchange data with other devices."],
["📐","10. ICT System Design",["System banane se pehle naqsha banana, yaani blueprint.","Components: hardware, software, data, network, people aur procedures.","Steps: requirements, feasibility, design, develop, test, implement aur maintain. Misaal: Student Record System."],"ICT system design is the process of planning how hardware, software, data, networks and people work together to meet user requirements."],
["⏱️","11. CPU Numericals",["Clock CPU ki dhadkan hai. Ek GHz matlab ek second mein ek billion dhadkan.","Cycle time barabar one divided by clock rate. CPU time barabar IC multiply CPI divided by clock rate.","Misaal: do GHz pe ek billion instructions aur CPI do ho, to CPU time ek second.","MIPS barabar clock rate divided by CPI multiply ten to the power six. Weighted CPI mein har fraction ko uske CPI se multiply karke jama karo."],"CPU time = (instruction count x CPI) / clock rate. Write: given, formula, substitution, and the answer with units."],
["🔢","12. Number Systems",["Binary se decimal banane ke liye har digit ko do ki power se multiply karo aur jama karo. Misaal: 1010.11 barabar 10.75.","Decimal se binary ke liye do se divide karte jao, remainders likho aur neeche se upar padho.","Misaal: 278 barabar 100010110. Fraction ke liye baar baar do se multiply karo."],"Binary to decimal: multiply each digit by its power of two and add. Decimal to binary: divide by two repeatedly and read the remainders from bottom to top."],
["⚡","13. Logic Gates",["AND mein dono one hon to output one. OR mein koi ek bhi one ho to output one. NOT ulta kar deta hai.","NAND aur NOR, AND aur OR ke ulte hain.","XOR mein inputs different hon to one. XNOR mein inputs same hon to one. Buffer mein jo input wohi output."],"Logic gates: AND, OR, NOT, NAND, NOR, XOR, XNOR and buffer. Always draw the symbol and the truth table."],
["🗄️","14. Databases",["Database digital almari hai jahan data organised rehta hai. DBMS uska manager software hai, jaise MySQL.","Table poora grid hai, Record ek mukammal entry, Field ek column.","Primary key har record ko unique banati hai, jaise StudentID. Foreign key doosre table ki key hai jo do tables ko jodti hai.","Relational mein tables aapas mein jude hote hain. Non relational mein documents ya key value hote hain."],"A database is an organised collection of related data; a DBMS manages it. A primary key uniquely identifies a record, while a foreign key links to another table."],
["🏦","15. Database Importance",["Istemal: school, bank, hospital, business, airline.","Redundancy yaani ek hi data baar baar. Isse inconsistency hoti hai. Database duplication kam karta hai.","Security: permissions, password, encryption. Backup data ki copy hai aur Recovery uss se data wapas lana."],"Databases organise information, reduce redundancy, keep data consistent, allow fast searching and controlled access. Backup and recovery protect against data loss."],
["🌊","16. SDLC aur Models",["SDLC software banane ka poora safar hai, jaise ghar banana. Isse time aur cost control mein rehti hai.","Waterfall seedha hota hai, ek phase khatam phir agla. Requirements fixed hon to use karte hain, jaise bank.","Agile chhote hisson mein feedback ke saath chalta hai, requirements badalti hon to. Spiral mein har chakkar mein risk analysis hota hai."],"SDLC is a structured process to plan, create, test, deploy and maintain software. Common models are Waterfall, Agile and Spiral."],
["📋","17. SDLC Phases",["Tarteeb yaad rakho: Planning, Requirements, Design, Development, Testing, Deployment, Maintenance.","Planning mein feasibility hoti hai: technical, economic, legal, operational aur schedule.","Requirements mein user se poochte hain. Design naqsha hai. Development code. Testing bugs. Deployment user ko dena. Maintenance fixes aur updates."],"SDLC phases in order: planning, requirements analysis, system design, development, testing, deployment and maintenance. Explain each in two lines."],
["🌍","18. Web Development",["HTML ghar ka dhancha hai, CSS rang aur design, JavaScript bijli aur interaction.","Front end wo hai jo user dekhta hai. Back end server pe logic aur database. Full stack dono.","Browser, Web server, URL website ka address, aur HTTPS secure hai. Website padhne ke liye, Web app kaam karne ke liye."],"HTML defines structure, CSS controls appearance and JavaScript adds interaction. Front end is what users see, back end runs on the server, and full stack covers both."],
["🛠️","19. Web Dev Steps",["Aath steps: Requirements, Planning, Design, Content, Development, Testing, Deployment, Maintenance.","Responsive design har screen pe sahi dikhta hai. Testing launch se pehle bugs pakadti hai. Maintenance website ko fresh aur secure rakhti hai."],"Web development steps: requirement gathering, planning, design, content preparation, development, testing, deployment and maintenance."],
["📁","20. Project",["Project ek temporary kaam hai jiska ek khaas result ho.","Aath stages: idea, objectives, plan, design, build, test, present, feedback.","Misaal Student Record System: add, update, search, view marks. Presentation: Problem, Objectives, Tools, Features, Testing, Result."],"An ICT project goes through selecting an idea, defining requirements, planning, designing, building, testing, presenting and collecting feedback."],
["🔍","21. Case Studies",["Paanch steps: masle ko Identify karo, topic se Link karo, case ki details ke saath Apply karo, Recommend karo, aur Conclude karo.","Misaal: school ka record register mein ho to database. Teen shehron mein office hon to WAN. Bank ka fixed system ho to Waterfall. Ek PC kharab hone se baqi band na hon to Star."],"Case study answer: identify the problem, link it to the concept, apply it using details from the case, recommend a solution with reasons, and conclude in one line."],
["🏆","22. Paper Tips",["Define pe ek do line ki definition aur example. Differentiate pe table. Explain pe definition, points aur example.","Har concept ke liye teen sawal: yeh kya hai, kyun chahiye, example kya hai. Saaf likho, headings underline karo, diagram banao. All the best!"],"Define, explain, differentiate with a table, give examples and draw diagrams. Good luck!"]
];
